spring.application.name=TicketMaster

# HTTP/2 (h2c cleartext)
server.http2.enabled=true

# === Virtual Threads（最關鍵：Tomcat 從 200 線程→無限虛擬線程）===
spring.threads.virtual.enabled=true

# === Tomcat 連接配置（防止 70K QPS 下連接被拒絕）===
server.tomcat.accept-count=8192
server.tomcat.max-connections=65536

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === HikariCP 連接池（支撐混合流量）===
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# === Redis 連接池（為 Step 4 緩存準備）===
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20

# Kafka topic configuration
# Local dev: 32 partitions, 3 replicas (3 brokers)
# K8s prod: 32 partitions, 3 replicas (3 brokers)
ticketmaster.kafka.partitions=32
ticketmaster.kafka.replicas=3

# Kafka
spring.kafka.bootstrap-servers=localhost:29092,localhost:39092,localhost:49092
spring.kafka.streams.application-id=ticketmaster-streams
spring.kafka.streams.properties[default.key.serde]=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties[default.value.serde]=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
spring.kafka.streams.properties[schema.registry.url]=http://localhost:8081
spring.kafka.streams.properties[application.server]=${KAFKA_STREAMS_APP_SERVER:localhost:${server.port:8080}}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081

# === Kafka producer 調優（批次 + 壓縮）===
# linger=30ms + batch=256KB: 均勻 flush，避免 1MB 大批次造成 GC pause 突刺
spring.kafka.producer.properties.linger.ms=30
spring.kafka.producer.properties.batch.size=262144
spring.kafka.producer.properties.buffer.memory=268435456
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Kafka Streams tuning
# 本機開發：16 線程（單 JVM 跑 2 個 topology，需要更多 threads 覆蓋 32 partitions）
# K8s 生產：由各 profile 覆蓋（replicas × threads = 32）
spring.kafka.streams.properties[num.stream.threads]=16
# linger 從 100ms→30ms：小 batch、頻繁 flush，降低 p95 抖動
spring.kafka.streams.properties[producer.linger.ms]=30
# batch 從 2MB→256KB：避免大批次造成 GC pause 突刺
spring.kafka.streams.properties[producer.batch.size]=262144
#With a larger payload in a batch, compression can be more efficient, further reducing the network overhead by reducing payload size.
spring.kafka.streams.properties[producer.compression.type]=lz4
spring.kafka.streams.properties[producer.buffer.memory]=268435456
# commit 從 100ms→50ms：2× checkpoint 頻率，降低端到端延遲
spring.kafka.streams.properties[commit.interval.ms]=50
spring.kafka.streams.properties[consumer.fetch.min.bytes]=4096
spring.kafka.streams.properties[consumer.fetch.max.wait.ms]=30
spring.kafka.streams.properties[processing.guarantee]=exactly_once_v2
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.auto-offset-reset=earliest


# OpenTelemetry (disabled - collector not running in dev environment)
# In K8s, use: otel-collector.observability.svc.cluster.local:4318
# For now, disable to avoid connection errors
management.tracing.sampling.probability=0

# === Frontend MVP — SSE bridge config (Phase 1) ===
# Override per env. See specs/frontend-mvp/api-contract.md §4.2.
ticketmaster.sse.heartbeat-interval-seconds=15
ticketmaster.sse.emitter-timeout-minutes=30
ticketmaster.kafka.section-status-topic=section-status

# === Frontend MVP — CORS ===
# Comma-separated list of allowed origins for the SPA.
ticketmaster.cors.allowed-origins=http://localhost:5173,http://localhost:3000
