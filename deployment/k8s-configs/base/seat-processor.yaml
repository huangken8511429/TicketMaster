apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketmaster-seat-processor
  labels:
    app: ticketmaster-seat-processor
spec:
  replicas: 32
  selector:
    matchLabels:
      app: ticketmaster-seat-processor
  template:
    metadata:
      labels:
        app: ticketmaster-seat-processor
    spec:
      containers:
        - name: seat-processor
          image: ticketmaster:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "seat-processor"
            - name: JAVA_OPTS
              value: "-XX:+UseZGC -XX:+ZGenerational -Xmx3g -Xms3g -XX:+AlwaysPreTouch"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
