# === Cloud SQL via Auth Proxy sidecar on 127.0.0.1:5432 ===
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# === Memorystore Redis ===
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# === Confluent Cloud Kafka (SASL_SSL + Schema Registry) ===
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}

spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS}

spring.kafka.streams.properties[security.protocol]=SASL_SSL
spring.kafka.streams.properties[sasl.mechanism]=PLAIN
spring.kafka.streams.properties[sasl.jaas.config]=${KAFKA_SASL_JAAS}

spring.kafka.streams.properties[schema.registry.url]=${SCHEMA_REGISTRY_URL}
spring.kafka.streams.properties[basic.auth.credentials.source]=USER_INFO
spring.kafka.streams.properties[basic.auth.user.info]=${SR_BASIC_AUTH_USER_INFO}

spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}
spring.kafka.producer.properties.basic.auth.credentials.source=USER_INFO
spring.kafka.producer.properties.basic.auth.user.info=${SR_BASIC_AUTH_USER_INFO}

spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}
spring.kafka.consumer.properties.basic.auth.credentials.source=USER_INFO
spring.kafka.consumer.properties.basic.auth.user.info=${SR_BASIC_AUTH_USER_INFO}

# === 32-instance perf tuning: 1 thread/pod × 32 replicas = 32 partitions (1:1) ===
spring.kafka.streams.properties[num.stream.threads]=1

# === Topology partition matches Confluent topic config ===
ticketmaster.kafka.partitions=${KAFKA_PARTITIONS}
ticketmaster.kafka.replicas=3

# === OTEL (collector deployed in `opentelemetry` namespace per ticket-master) ===
management.tracing.sampling.probability=0.1

# === CORS — allow the Cloud Run frontend ===
ticketmaster.cors.allowed-origins=${FRONTEND_ORIGIN}
